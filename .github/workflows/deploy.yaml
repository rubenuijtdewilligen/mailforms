name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to CapRover
        uses: caprover/deploy-to-caprover@v2
        with:
          server: 'c.rbnu.nl'
          app: 'mailforms'
          token: ${{ secrets.APP_TOKEN }}
